<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鍛刀シミュレーター (All 700)</title>
    <!-- Excel読み込み用ライブラリ (SheetJS) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Sans-Serif;
            text-align: center;
            background-color: #2b2b36;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #1e1e24;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
        }

        .status-area {
            font-size: 13px;
            margin-bottom: 15px;
            color: #aaa;
        }

        .resource-box {
            display: flex;
            justify-content: space-around;
            background: #2a2a35;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
            color: #ffca28;
            border: 1px solid #444;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        button.btn-multi {
            background: linear-gradient(135deg, #e65100, #bf360c);
        }

        button.btn-reset {
            background: #555;
            font-size: 12px;
            padding: 6px 12px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background-color: #141419;
            border: 1px solid #333;
            min-height: 120px;
        }

        /* 統計エリア */
        .stats-container {
            margin-top: 25px;
            background: #252530;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #444;
            text-align: left;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .stats-title {
            font-weight: bold;
            color: #ffca28;
            font-size: 15px;
        }

        .total-count-badge {
            font-size: 16px;
            font-weight: bold;
            color: #ffe082;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-item {
            background: #1a1a20;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #555;
        }

        .history-item.rank-gold {
            border-left-color: #ffd700;
        }

        .history-item.rank-silver {
            border-left-color: #b0bec5;
        }

        .history-item.rank-bronze {
            border-left-color: #cd7f32;
        }

        /* ガチャグリッド表示 */
        .gacha-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        /* 基本カード */
        .gacha-card {
            background: #252530;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* レア度別スタイル */
        .gacha-card.rank-gold {
            background: linear-gradient(135deg, #3d3215, #1f1807);
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            animation: goldGlow 2s infinite alternate;
        }

        .gacha-card.rank-gold .badge {
            background: linear-gradient(135deg, #ffd700, #ffa000);
            color: #000;
            font-weight: bold;
        }

        .gacha-card.rank-gold .sword-name {
            color: #ffe082;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        .gacha-card.rank-silver {
            background: linear-gradient(135deg, #2c3540, #182026);
            border: 2px solid #b0bec5;
            box-shadow: 0 0 8px rgba(176, 190, 197, 0.4);
        }

        .gacha-card.rank-silver .badge {
            background-color: #78909c;
            color: #fff;
        }

        .gacha-card.rank-silver .sword-name {
            color: #e0e0e0;
        }

        .gacha-card.rank-bronze {
            background: linear-gradient(135deg, #36251b, #1c130e);
            border: 2px solid #cd7f32;
            box-shadow: 0 0 6px rgba(205, 127, 50, 0.3);
        }

        .gacha-card.rank-bronze .badge {
            background-color: #a16226;
            color: #fff;
        }

        .gacha-card.rank-bronze .sword-name {
            color: #ffcc99;
        }

        @keyframes goldGlow {
            0% {
                box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
            }

            100% {
                box-shadow: 0 0 18px rgba(255, 215, 0, 0.9);
            }
        }

        .badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-bottom: 6px;
            background-color: #444;
            color: #ccc;
        }

        .sword-id {
            font-size: 11px;
            color: #aaa;
        }

        .sword-name {
            font-size: 14px;
            color: #fff;
            font-weight: bold;
            margin-top: 4px;
            word-break: break-all;
        }

        .single-container {
            display: flex;
            justify-content: center;
        }

        .single-container .gacha-card {
            width: 180px;
            padding: 20px 10px;
        }

        .single-container .sword-name {
            font-size: 20px;
        }

        .error {
            color: #ff5252 !important;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>鍛刀シミュレーター (All 700)</h2>

        <div class="status-area" id="status">Excelデータ (touken_mst.xlsx) を読み込んでいます...</div>

        <!-- 資材固定表示 -->
        <div class="resource-box">
            <span>木炭: 700</span>
            <span>玉鋼: 700</span>
            <span>冷却材: 700</span>
            <span>砥石: 700</span>
        </div>

        <div class="button-group">
            <button id="singleBtn" onclick="craft(1)" disabled>単発鍛刀</button>
            <button id="multiBtn" class="btn-multi" onclick="craft(10)" disabled>10連鍛刀</button>
        </div>

        <div id="result">
            <p style="color:#888;">データを準備中です...</p>
        </div>

        <!-- 成果集計・カウントエリア -->
        <div class="stats-container">
            <div class="stats-header">
                <div class="stats-title">
                    📊 鍛刀結果の集計 (<span class="total-count-badge" id="totalCount">0</span> 連)
                </div>
                <button class="btn-reset" onclick="resetStats()">データリセット</button>
            </div>
            <div class="history-list" id="historyList">
                <div style="color:#777; font-size:12px; grid-column: 1 / -1;">鍛刀を行うと、ここに獲得した刀剣男士の獲得数が記録されます。</div>
            </div>
        </div>
    </div>

    <script>
        let swordDatabase = [];
        let totalDrawCount = 0;
        let swordCounts = {}; // { id: 獲得数 }

        const EXCEL_FILE_PATH = 'touken_mst.xlsx';

        window.addEventListener('DOMContentLoaded', () => {
            loadExcelAutomatically();
        });

        async function loadExcelAutomatically() {
            const statusEl = document.getElementById('status');
            const resultEl = document.getElementById('result');

            try {
                const response = await fetch(EXCEL_FILE_PATH);
                if (!response.ok) {
                    throw new Error(`ファイルが見つかりません (${response.status} ${response.statusText})`);
                }

                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });

                const gachaSheet = workbook.Sheets['gacha'];
                if (!gachaSheet) throw new Error("シート名 'gacha' が見つかりません。");
                const probData = XLSX.utils.sheet_to_json(gachaSheet);

                const charSheet = workbook.Sheets['char'];
                if (!charSheet) throw new Error("シート名 'char' が見つかりません。");
                const charData = XLSX.utils.sheet_to_json(charSheet);

                const nameMap = {};
                charData.forEach(row => {
                    nameMap[row.id] = row.name || row.名前 || row.キャラクター名 || `刀帳No.${row.id}`;
                });

                swordDatabase = probData.map(row => ({
                    id: row.id,
                    parse: parseFloat(row.parse) || 0,
                    name: nameMap[row.id] || `刀帳No.${row.id}`
                })).filter(item => item.parse > 0);

                if (swordDatabase.length === 0) {
                    throw new Error("有効なデータがありません。");
                }

                statusEl.textContent = `データ読み込み完了（登録数: ${swordDatabase.length}件）`;
                statusEl.style.color = "#81c784";

                document.getElementById('singleBtn').disabled = false;
                document.getElementById('multiBtn').disabled = false;
                resultEl.innerHTML = "<p style='color:#aaa;'>「単発鍛刀」または「10連鍛刀」を押してください。</p>";

            } catch (error) {
                statusEl.textContent = `エラー: ${error.message}`;
                statusEl.classList.add('error');
                resultEl.innerHTML = `<p class="error">データ読み込みに失敗しました。</p>`;
            }
        }

        function drawOne() {
            const totalWeight = swordDatabase.reduce((sum, item) => sum + item.parse, 0);
            let random = Math.random() * totalWeight;

            for (const sword of swordDatabase) {
                if (random < sword.parse) {
                    return sword;
                }
                random -= sword.parse;
            }
            return swordDatabase[swordDatabase.length - 1];
        }

        function getRarityInfo(parse) {
            if (parse <= 0.001) {
                return { class: 'rank-gold', label: '極超極稀' };
            } else if (parse <= 0.005) {
                return { class: 'rank-silver', label: '超極稀' };
            } else if (parse < 0.015) {
                return { class: 'rank-bronze', label: '極稀' };
            } else {
                return { class: '', label: '通常' };
            }
        }

        function createCardHtml(sword) {
            const rarity = getRarityInfo(sword.parse);
            return `
    <div class="gacha-card ${rarity.class}">
      <div class="badge">${rarity.label}</div>
      <div class="sword-id">No.${sword.id}</div>
      <div class="sword-name">${sword.name}</div>
    </div>
  `;
        }

        function craft(count) {
            if (swordDatabase.length === 0) return;

            const resultDiv = document.getElementById('result');
            let cardsHtml = '';

            for (let i = 0; i < count; i++) {
                const selected = drawOne();

                // カウントの加算処理
                totalDrawCount++;
                swordCounts[selected.id] = (swordCounts[selected.id] || 0) + 1;

                cardsHtml += createCardHtml(selected);
            }

            if (count === 1) {
                resultDiv.innerHTML = `<div class="single-container">${cardsHtml}</div>`;
            } else {
                resultDiv.innerHTML = `
      <div style="font-weight:bold; margin-bottom:10px; color:#ffca28;">【10連鍛刀結果】</div>
      <div class="gacha-grid">${cardsHtml}</div>
    `;
            }

            // 集計表示の更新
            updateStatsDisplay();
        }

        // カウント状況を更新して描画
        function updateStatsDisplay() {
            document.getElementById('totalCount').textContent = totalDrawCount;

            const historyListEl = document.getElementById('historyList');

            if (totalDrawCount === 0) {
                historyListEl.innerHTML = '<div style="color:#777; font-size:12px; grid-column: 1 / -1;">鍛刀を行うと、ここに獲得した刀剣男士の獲得数が記録されます。</div>';
                return;
            }

            // 出現した刀剣男士を「レア順(parse昇順) -> ID順」でソート
            const countedSwords = swordDatabase
                .filter(sword => swordCounts[sword.id] > 0)
                .sort((a, b) => {
                    if (a.parse !== b.parse) return a.parse - b.parse;
                    return a.id - b.id;
                });

            let listHtml = '';
            countedSwords.forEach(sword => {
                const rarity = getRarityInfo(sword.parse);
                const count = swordCounts[sword.id];
                listHtml += `
      <div class="history-item ${rarity.class}">
        <span>${sword.name}</span>
        <span style="font-weight:bold; color:#ffca28;">× ${count}</span>
      </div>
    `;
            });

            historyListEl.innerHTML = listHtml;
        }

        // カウントのリセット
        function resetStats() {
            if (totalDrawCount === 0) return;
            if (confirm("これまでの鍛刀カウントと獲得履歴をリセットしますか？")) {
                totalDrawCount = 0;
                swordCounts = {};
                updateStatsDisplay();
            }
        }
    </script>

</body>

</html>
