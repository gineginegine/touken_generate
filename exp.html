<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刀剣乱舞 レベル・経験値計算ツール</title>
    <!-- Excelファイル読み込み用ライブラリ (SheetJS) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #4a3b52;
            --accent-color: #8a3b5c;
            --bg-color: #f7f5f8;
            --card-bg: #ffffff;
            --border-color: #e0d8e3;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", MeiYo, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 28px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .status-bar {
            font-size: 0.85rem;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .status-bar.success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 0.95rem;
            color: var(--primary-color);
        }

        select,
        input[type="number"] {
            box-sizing: border-box;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fff;
        }

        select:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 5px rgba(138, 59, 92, 0.3);
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .radio-group label {
            font-weight: normal;
            cursor: pointer;
        }

        .sub-section {
            background-color: #fcfbfe;
            border: 1px dashed var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--accent-color);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 24px;
            padding: 18px;
            background-color: #f3eff5;
            border-radius: 8px;
            border-left: 5px solid var(--accent-color);
            display: none;
        }

        .result-box h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 10px 0;
        }

        .kiwame-preview {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
            display: none;
        }

        .result-detail {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.6;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- ホームに戻るリンク -->
        <a href="home.html"
            style="display: inline-block; margin-bottom: 15px; color: #4a3b52; text-decoration: none; font-size: 0.9rem; font-weight: bold;">
            ← ホームに戻る
        </a>

        <h1>刀剣男士 レベル・経験値計算ツール</h1>

        <div id="status" class="status-bar">データファイル（exp_table.xlsx）を読み込み中...</div>

        <form id="calcForm">
            <!-- 刀種の選択 -->
            <div class="form-group">
                <label for="swordType">刀種を選択</label>
                <select id="swordType" required disabled>
                    <option value="">選択してください</option>
                    <option value="kwmtt">短刀</option>
                    <option value="kwmw">脇差・槍・薙刀</option>
                    <option value="kwmu1">打刀 2スロット</option>
                    <option value="kwmu2">打刀 3スロット</option>
                    <option value="kwmtc">太刀</option>
                    <option value="kwmo">大太刀・剣</option>
                </select>
            </div>

            <!-- 状態の選択 -->
            <div class="form-group">
                <label>現在の刀剣男士の状態</label>
                <div class="radio-group">
                    <label><input type="radio" name="state" value="toku" checked> 初・特（修行前）</label>
                    <label><input type="radio" name="state" value="kiwame"> 極（きわめ）</label>
                </div>
            </div>

            <!-- パターンA: 初・特 -->
            <div id="tokuSection" class="sub-section">
                <div class="form-group">
                    <label for="tokuExp">「初・特」の累積経験値</label>
                    <input type="number" id="tokuExp" min="0" placeholder="例: 1407500 や 2500000">
                    <small style="color:#666;">※現在の初・特での累積EXPを入力します。</small>
                </div>
            </div>

            <!-- パターンB: 極 -->
            <div id="kiwameSection" class="sub-section" style="display: none;">
                <div class="form-group">
                    <label for="totalKiwameExp">累積経験値</label>
                    <input type="number" id="totalKiwameExp" min="0" placeholder="例: 2500000">
                </div>
            </div>

            <button type="button" id="calcBtn" disabled>レベルを計算する</button>
        </form>

        <!-- 結果表示部分 -->
        <div id="resultBox" class="result-box">
            <h2>計算結果</h2>
            <div id="resultCurrent" class="result-value">Lv. --</div>
            <div id="kiwamePreview" class="kiwame-preview"></div>
            <div id="resultDetail" class="result-detail"></div>
        </div>
    </div>

    <script>
        let expData = [];

        // 刀種ごとの修行解禁最低レベル
        const MIN_KIWAME_LEVELS = {
            'kwmtt': 60, // 短刀
            'kwmw': 65, // 脇差・槍・薙刀
            'kwmu1': 70, // 打刀(2スロット)
            'kwmu2': 70, // 打刀(3スロット)
            'kwmtc': 75, // 太刀
            'kwmo': 80  // 大太刀・剣
        };

        // DOM要素
        const statusEl = document.getElementById('status');
        const swordTypeSelect = document.getElementById('swordType');
        const stateRadios = document.querySelectorAll('input[name="state"]');
        const tokuSection = document.getElementById('tokuSection');
        const kiwameSection = document.getElementById('kiwameSection');
        const calcBtn = document.getElementById('calcBtn');
        const resultBox = document.getElementById('resultBox');
        const resultCurrent = document.getElementById('resultCurrent');
        const kiwamePreview = document.getElementById('kiwamePreview');
        const resultDetail = document.getElementById('resultDetail');

        // Excelデータ読み込み
        window.addEventListener('DOMContentLoaded', () => {
            // 未認証の場合はホーム画面へリダイレクト
            if (sessionStorage.getItem('isAuthorized') !== 'true') {
                window.location.href = 'home.html';
                return;
            }

            fetch('exp_table.xlsx')
                .then(response => {
                    if (!response.ok) throw new Error('ファイルが読み込めません。');
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    const workbook = XLSX.read(buffer, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rawData = XLSX.utils.sheet_to_json(worksheet);

                    // 列名の表記ブレ（大文字・スペース等）を小文字に正規化する処理
                    expData = rawData.map(row => {
                        const normalizedRow = {};
                        Object.keys(row).forEach(key => {
                            const cleanKey = key.trim().toLowerCase();
                            normalizedRow[cleanKey] = row[key];
                        });
                        return normalizedRow;
                    });

                    statusEl.textContent = 'データファイル（exp_table.xlsx）の読み込み完了';
                    statusEl.classList.add('success');
                    swordTypeSelect.disabled = false;
                    calcBtn.disabled = false;
                })
                .catch(error => {
                    console.error(error);
                    statusEl.textContent = 'エラー: exp_table.xlsx の読み込みに失敗しました。';
                });
        });

        // Radio切替
        stateRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'toku') {
                    tokuSection.style.display = 'block';
                    kiwameSection.style.display = 'none';
                } else {
                    tokuSection.style.display = 'none';
                    kiwameSection.style.display = 'block';
                }
            });
        });

        // 計算実行
        calcBtn.addEventListener('click', () => {
            const swordType = swordTypeSelect.value;
            if (!swordType) {
                alert('刀種を選択してください。');
                return;
            }

            const state = document.querySelector('input[name="state"]:checked').value;
            const minKiwameLv = MIN_KIWAME_LEVELS[swordType] || 60;
            const minRequiredExp = getExpFromLevel(minKiwameLv, 'toku');

            if (state === 'toku') {
                // --- 【初・特】 ---
                const totalTokuExp = parseInt(document.getElementById('tokuExp').value) || 0;
                const currentTokuLv = getLevelFromExp(totalTokuExp, 'toku');

                resultCurrent.textContent = `特 Lv. ${currentTokuLv}`;

                // 累積経験値が解禁必要経験値以上の場合のみ「極プレビュー」を表示
                if (minRequiredExp > 0 && totalTokuExp >= minRequiredExp) {
                    const kiwameAppliedExp = totalTokuExp - minRequiredExp;
                    const kiwameLv = getLevelFromExp(kiwameAppliedExp, swordType);

                    kiwamePreview.style.display = 'block';
                    kiwamePreview.innerHTML = `修行に出した場合 ➔ <span style="color:#8a3b5c;">極 Lv. ${kiwameLv}</span>`;
                } else {
                    // 未達成の場合：極に関する表記は行わず、解禁までの必要EXPのみ案内
                    const remainExp = Math.max(0, minRequiredExp - totalTokuExp);
                    kiwamePreview.style.display = 'none';
                    kiwamePreview.innerHTML = '';
                    resultDetail.innerHTML = `
          現在の初・特累計EXP: <strong>${totalTokuExp.toLocaleString()}</strong> EXP<br>
          ※修行解禁（Lv.${minKiwameLv}）まであと <strong>${remainExp.toLocaleString()}</strong> EXP 必要です。
        `;
                }

            } else {
                // --- 【極】 ---
                const totalKiwameExpInput = parseInt(document.getElementById('totalKiwameExp').value) || 0;

                const kiwameAppliedExp = Math.max(0, totalKiwameExpInput - minRequiredExp);
                const currentKiwameLv = getLevelFromExp(kiwameAppliedExp, swordType);

                // 次のレベルまでの必要EXP計算
                const nextKiwameRow = expData.find(r => Number(r.level) === currentKiwameLv + 1);
                let nextExpText = "（最高レベルです）";
                if (nextKiwameRow && nextKiwameRow[swordType] !== undefined) {
                    const remainForNext = Number(nextKiwameRow[swordType]) - kiwameAppliedExp;
                    nextExpText = `（次の Lv.${currentKiwameLv + 1} まであと <strong>${remainForNext.toLocaleString()}</strong> EXP）`;
                }

                kiwamePreview.style.display = 'none';
                kiwamePreview.innerHTML = '';
                resultCurrent.textContent = `極 Lv. ${currentKiwameLv}`;
            }

            resultBox.style.display = 'block';
        });

        // 累積EXPからレベルを判定
        function getLevelFromExp(exp, columnKey) {
            let level = 1;
            for (let i = 0; i < expData.length; i++) {
                const rowExp = Number(expData[i][columnKey]);
                if (!isNaN(rowExp) && exp >= rowExp) {
                    level = Number(expData[i].level) || (i + 1);
                } else if (!isNaN(rowExp) && exp < rowExp) {
                    break;
                }
            }
            return level;
        }

        // 指定レベルの必要累計EXPを取得
        function getExpFromLevel(level, columnKey) {
            const row = expData.find(r => Number(r.level) === Number(level));
            if (row && row[columnKey] !== undefined) {
                return Number(row[columnKey]) || 0;
            }
            // バックアップ用（配列インデックスで判定）
            if (expData[level - 1] && expData[level - 1][columnKey] !== undefined) {
                return Number(expData[level - 1][columnKey]) || 0;
            }
            return 0;
        }
    </script>

</body>

</html>
